<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title description">
  <title id="title">else-if — When it stops working, try something else.</title>
  <desc id="description">A code-inspired banner: if the approach works, keep going; else if you are stuck, try one change, compare, and learn.</desc>
  <rect width="1440" height="480" rx="24" fill="#f5f2e9"/>
  <path d="M760 48V432" stroke="#ded9ce"/>
  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace">
    <text x="72" y="80" font-size="18" letter-spacing="2" fill="#645f54">SMALL EXPERIMENTS. NEXT STEPS.</text>
    <text x="65" y="246" font-size="152" font-weight="700" letter-spacing="-9" fill="#252820">else<tspan fill="#d34c2b">-</tspan>if</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#252820">
    <text x="72" y="320">When it stops working,</text>
    <text x="72" y="366">try something else.</text>
  </g>
  <rect x="804" y="48" width="588" height="384" rx="16" fill="#ece7db"/>
  <path d="M828 222V380" stroke="#d34c2b" stroke-width="4" stroke-linecap="round"/>
  <g font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="24">
    <g fill="#746e62">
      <text x="852" y="112">if (it_works) {</text>
      <text x="882" y="152">keep_going();</text>
    </g>
    <text x="852" y="212" fill="#252820">} <tspan fill="#bd3e21" font-weight="700">else if</tspan> (you_are_stuck) {</text>
    <g fill="#252820">
      <text x="882" y="262">try_one_change();</text>
      <text x="882" y="302">compare();</text>
      <text x="882" y="342">learn();</text>
    </g>
    <text x="852" y="402" fill="#bd3e21">}</text>
  </g>
</svg>
